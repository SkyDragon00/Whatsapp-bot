<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Citas Agendadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<style>
  :root {
    --blue: #1a73e8;
    --blue-dark: #1557b0;
    --surface: #ffffff;
    --bg: #f6f8fc;
    --border: #dadce0;
    --text: #3c4043;
    --text-secondary: #5f6368;
    --green: #1e8e3e;
    --red: #d93025;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    font-family: 'Roboto', Arial, sans-serif;
    color: var(--text);
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  header svg { flex-shrink: 0; }

  header h1 {
    font-family: 'Google Sans', 'Roboto', sans-serif;
    font-size: 22px;
    font-weight: 500;
    margin: 0;
    color: var(--text);
  }
  .header-spacer {
    flex: 1;
  }
  .icon-button {
    border: none;
    background: transparent;
    cursor: pointer;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
  }
  .icon-button:hover {
    background: #f1f3f4;
    color: var(--text);
  }

  main {
    max-width: 1100px;
    margin: 24px auto;
    padding: 0 24px 40px;
  }

  #calendar-card {
    background: var(--surface);
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
    padding: 20px;
  }

  /* FullCalendar overrides for a Google-ish look */
  .fc {
    font-family: 'Roboto', Arial, sans-serif;
  }
  .fc .fc-toolbar-title {
    font-family: 'Google Sans', 'Roboto', sans-serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
  }
  .fc .fc-button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    text-transform: capitalize;
    box-shadow: none;
    font-weight: 500;
  }
  .fc .fc-button:hover {
    background: #f1f3f4;
  }
  .fc .fc-button-primary:not(:disabled).fc-button-active,
  .fc .fc-button-primary:not(:disabled):active {
    background: #e8f0fe;
    color: var(--blue);
    border-color: var(--border);
  }
  .fc .fc-today-button {
    text-transform: capitalize;
  }
  .fc-daygrid-day.fc-day-today {
    background: #e8f0fe !important;
  }
  .fc-col-header-cell {
    background: transparent;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .fc-theme-standard td, .fc-theme-standard th {
    border-color: #eeeeee;
  }
  .fc-event {
    cursor: pointer;
    border: none !important;
    border-radius: 4px;
    padding: 2px 4px;
    font-size: 12px;
  }
  .service-consulta { background: var(--blue) !important; }
  .service-default { background: #7c4dff !important; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(60,64,67,0.5);
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal-overlay.open {
    display: flex;
  }
  .modal-card {
    background: var(--surface);
    border-radius: 12px;
    width: 360px;
    max-width: 90vw;
    box-shadow: 0 4px 8px rgba(60,64,67,0.28), 0 1px 3px rgba(60,64,67,0.3);
    overflow: hidden;
    animation: pop 0.15s ease-out;
  }
  @keyframes pop {
    from { transform: scale(0.96); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-header {
    display: flex;
    justify-content: flex-end;
    padding: 8px 8px 0;
  }
  .modal-close {
    border: none;
    background: transparent;
    cursor: pointer;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
  }
  .modal-close:hover {
    background: #f1f3f4;
  }
  .modal-body {
    padding: 4px 24px 28px;
  }
  .modal-title {
    font-family: 'Google Sans', 'Roboto', sans-serif;
    font-size: 20px;
    font-weight: 500;
    margin: 0 0 20px;
    color: var(--text);
  }
  .modal-row {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 18px;
  }
  .modal-row:last-child { margin-bottom: 0; }
  .modal-row svg {
    flex-shrink: 0;
    margin-top: 2px;
    color: var(--text-secondary);
  }
  .modal-row .label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 2px;
  }
  .modal-row .value {
    font-size: 14px;
    color: var(--text);
  }

  .empty-state {
    text-align: center;
    color: var(--text-secondary);
    padding: 40px;
    font-size: 14px;
  }

  .settings-card {
    width: 640px;
  }
  .settings-body {
    padding-bottom: 24px;
  }
  .settings-section {
    margin-bottom: 22px;
  }
  .settings-section:last-child {
    margin-bottom: 0;
  }
  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 8px;
  }
  .duration-input {
    width: 140px;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font: inherit;
    padding: 9px 10px;
  }
  .hours-list {
    display: grid;
    gap: 10px;
  }
  .hours-row {
    display: grid;
    grid-template-columns: 120px 84px 1fr 1fr;
    align-items: center;
    gap: 12px;
    min-height: 44px;
  }
  .day-name {
    font-size: 14px;
    font-weight: 500;
  }
  .day-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .time-input {
    width: 100%;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font: inherit;
    padding: 8px 10px;
  }
  .settings-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 24px;
  }
  .text-button,
  .primary-button {
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    font: inherit;
    font-weight: 500;
    min-height: 38px;
    padding: 8px 14px;
  }
  .text-button {
    background: transparent;
    color: var(--blue);
  }
  .text-button:hover {
    background: #f1f3f4;
  }
  .primary-button {
    background: var(--blue);
    color: #fff;
  }
  .primary-button:hover {
    background: var(--blue-dark);
  }
  .settings-error {
    color: var(--red);
    font-size: 13px;
    min-height: 18px;
    margin-top: 12px;
  }

  @media (max-width: 640px) {
    header {
      padding: 12px 16px;
    }
    main {
      margin-top: 16px;
      padding: 0 12px 28px;
    }
    #calendar-card {
      padding: 12px;
    }
    .hours-row {
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid #eeeeee;
    }
    .hours-row .time-input {
      grid-column: span 1;
    }
  }
</style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
    <rect x="3" y="4" width="18" height="17" rx="2" stroke="#1a73e8" stroke-width="1.8"/>
    <path d="M3 9H21" stroke="#1a73e8" stroke-width="1.8"/>
    <path d="M8 2V6" stroke="#1a73e8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M16 2V6" stroke="#1a73e8" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="7" y="12" width="3" height="3" rx="0.5" fill="#1a73e8"/>
  </svg>
  <h1>Citas Agendadas</h1>
  <div class="header-spacer"></div>
  <button class="icon-button" id="settingsOpen" aria-label="Configuracion" title="Configuracion">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z" stroke="currentColor" stroke-width="1.8"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.37a1.7 1.7 0 0 0-1 .46V20a2 2 0 0 1-4 0v-.09a1.7 1.7 0 0 0-1-.46 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.63 15a1.7 1.7 0 0 0-.46-1H4a2 2 0 0 1 0-4h.17a1.7 1.7 0 0 0 .46-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1-.46V4a2 2 0 0 1 4 0v.17a1.7 1.7 0 0 0 1 .46 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.37 9c.18.33.33.66.46 1H20a2 2 0 0 1 0 4h-.17a1.7 1.7 0 0 0-.43 1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</header>

<main>
  <div id="calendar-card">
    <div id="calendar"></div>
  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-header">
      <button class="modal-close" id="modalClose" aria-label="Cerrar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <h2 class="modal-title" id="modalPatient"></h2>

      <div class="modal-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/></svg>
        <div>
          <div class="label">Fecha y hora</div>
          <div class="value" id="modalDate"></div>
        </div>
      </div>

      <div class="modal-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/></svg>
        <div>
          <div class="label">Servicio</div>
          <div class="value" id="modalService"></div>
        </div>
      </div>

      <div class="modal-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 21c0-4 4-6 9-6s9 2 9 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/></svg>
        <div>
          <div class="label">Teléfono (WhatsApp)</div>
          <div class="value" id="modalPhone"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal-card settings-card">
    <div class="modal-header">
      <button class="modal-close" id="settingsClose" aria-label="Cerrar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <form class="modal-body settings-body" id="settingsForm">
      <h2 class="modal-title">Configuracion</h2>

      <div class="settings-section">
        <label class="field-label" for="appointmentDuration">Duracion de cada cita (minutos)</label>
        <input class="duration-input" id="appointmentDuration" name="appointmentDuration" type="number" min="15" max="480" step="15" required />
      </div>

      <div class="settings-section">
        <div class="field-label">Horario de atencion</div>
        <div class="hours-list" id="businessHoursList"></div>
      </div>

      <div class="settings-error" id="settingsError" role="alert"></div>

      <div class="settings-actions">
        <button class="text-button" type="button" id="settingsCancel">Cancelar</button>
        <button class="primary-button" type="submit">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script>
  const overlay = document.getElementById('modalOverlay');
  const modalClose = document.getElementById('modalClose');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const settingsOpen = document.getElementById('settingsOpen');
  const settingsClose = document.getElementById('settingsClose');
  const settingsCancel = document.getElementById('settingsCancel');
  const settingsForm = document.getElementById('settingsForm');
  const settingsError = document.getElementById('settingsError');
  const businessHoursList = document.getElementById('businessHoursList');
  const appointmentDuration = document.getElementById('appointmentDuration');

  const dayLabels = ['Domingo', 'Lunes', 'Martes', 'Miercoles', 'Jueves', 'Viernes', 'Sabado'];
  let currentSettings = null;
  let calendar = null;

  function openModal(appt) {
    document.getElementById('modalPatient').textContent = appt.patient_name;
    document.getElementById('modalDate').textContent = new Date(appt.date_iso).toLocaleString('es-EC', {
      dateStyle: 'full',
      timeStyle: 'short',
    });
    document.getElementById('modalService').textContent = appt.service;
    document.getElementById('modalPhone').textContent = appt.phone.replace('@c.us', '');
    overlay.classList.add('open');
  }

  function closeModal() {
    overlay.classList.remove('open');
  }

  async function openSettings() {
    if (!currentSettings) await loadSettings();
    renderSettingsForm(currentSettings);
    settingsError.textContent = '';
    settingsOverlay.classList.add('open');
  }

  function closeSettings() {
    settingsOverlay.classList.remove('open');
  }

  function renderSettingsForm(settings) {
    appointmentDuration.value = settings.appointmentDurationMinutes;
    businessHoursList.innerHTML = settings.businessHours.map((day) => `
      <div class="hours-row" data-day="${day.day}">
        <div class="day-name">${dayLabels[day.day]}</div>
        <label class="day-toggle">
          <input type="checkbox" class="day-enabled" ${day.enabled ? 'checked' : ''} />
          Abierto
        </label>
        <input class="time-input day-start" type="time" value="${day.start}" aria-label="${dayLabels[day.day]} inicio" required />
        <input class="time-input day-end" type="time" value="${day.end}" aria-label="${dayLabels[day.day]} cierre" required />
      </div>
    `).join('');
    updateDisabledTimeInputs();
  }

  function readSettingsForm() {
    return {
      appointmentDurationMinutes: Number(appointmentDuration.value),
      businessHours: Array.from(businessHoursList.querySelectorAll('.hours-row')).map((row) => ({
        day: Number(row.dataset.day),
        enabled: row.querySelector('.day-enabled').checked,
        start: row.querySelector('.day-start').value,
        end: row.querySelector('.day-end').value,
      })),
    };
  }

  function updateDisabledTimeInputs() {
    businessHoursList.querySelectorAll('.hours-row').forEach((row) => {
      const enabled = row.querySelector('.day-enabled').checked;
      row.querySelectorAll('.time-input').forEach((input) => {
        input.disabled = !enabled;
      });
    });
  }

  function getEventEnd(startIso) {
    const end = new Date(startIso);
    end.setMinutes(end.getMinutes() + currentSettings.appointmentDurationMinutes);
    return end.toISOString();
  }

  function mapAppointmentToEvent(a) {
    return {
      title: `${a.patient_name} · ${a.service}`,
      start: a.date_iso,
      end: getEventEnd(a.date_iso),
      extendedProps: { ...a },
    };
  }

  function getCalendarBusinessHours(settings) {
    const openDays = settings.businessHours.filter((day) => day.enabled);
    if (openDays.length === 0) return false;
    return openDays.map((day) => ({
      daysOfWeek: [day.day],
      startTime: day.start,
      endTime: day.end,
    }));
  }

  function formatDuration(minutes) {
    const hours = Math.floor(minutes / 60);
    const mins = minutes % 60;
    return `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:00`;
  }

  async function loadSettings() {
    const res = await fetch('/api/settings');
    currentSettings = await res.json();
  }

  async function saveSettings(settings) {
    const res = await fetch('/api/settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(settings),
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'No se pudo guardar la configuracion.');
    currentSettings = data;
    return data;
  }

  // Cerrar con la X
  modalClose.addEventListener('click', closeModal);
  settingsOpen.addEventListener('click', openSettings);
  settingsClose.addEventListener('click', closeSettings);
  settingsCancel.addEventListener('click', closeSettings);
  businessHoursList.addEventListener('change', (e) => {
    if (e.target.classList.contains('day-enabled')) updateDisabledTimeInputs();
  });

  // Cerrar haciendo click fuera de la tarjeta (en el fondo oscuro)
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });
  settingsOverlay.addEventListener('click', (e) => {
    if (e.target === settingsOverlay) closeSettings();
  });

  // Cerrar con tecla Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeModal();
      closeSettings();
    }
  });

  settingsForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    settingsError.textContent = '';

    try {
      const saved = await saveSettings(readSettingsForm());
      if (calendar) {
        calendar.setOption('businessHours', getCalendarBusinessHours(saved));
        calendar.setOption('slotDuration', formatDuration(saved.appointmentDurationMinutes));
        calendar.removeAllEvents();
        const res = await fetch('/api/appointments');
        const appointments = await res.json();
        calendar.addEventSource(appointments.map(mapAppointmentToEvent));
      }
      closeSettings();
    } catch (error) {
      settingsError.textContent = error.message;
    }
  });

  document.addEventListener('DOMContentLoaded', async () => {
    await loadSettings();
    const res = await fetch('/api/appointments');
    const appointments = await res.json();

    const calendarEl = document.getElementById('calendar');

    if (appointments.length === 0) {
      // Igual inicializamos el calendario vacío, solo informativo
    }

    const events = appointments.map(mapAppointmentToEvent);

    calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      locale: 'es',
      height: 'auto',
      businessHours: getCalendarBusinessHours(currentSettings),
      slotDuration: formatDuration(currentSettings.appointmentDurationMinutes),
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek,timeGridDay',
      },
      buttonText: {
        today: 'Hoy',
        month: 'Mes',
        week: 'Semana',
        day: 'Día',
      },
      events: events,
      eventTimeFormat: {
        hour: '2-digit',
        minute: '2-digit',
        meridiem: 'short',
      },
      eventClick: function (info) {
        openModal(info.event.extendedProps);
      },
    });

    calendar.render();
  });
</script>

</body>
</html>
